<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="A compact live clock for London, New York and Rotterdam.">
  <title>World Clock — London, New York &amp; Rotterdam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: "Poppins", ui-sans-serif, system-ui, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      width: 100px;
      height: 40px;
      margin: 0;
      overflow: hidden;
      background: #fff;
      color: #172338;
    }

    .widget {
      width: 100px;
      height: 40px;
      overflow: hidden;
      padding: 1px 3px;
    }

    .city {
      height: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-top: 1px solid #e5e7eb;
    }

    .city-name {
      color: #172338;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .01em;
    }

    .clock {
      color: #172338;
      font-size: 8px;
      font-variant-numeric: tabular-nums;
      font-weight: 550;
      letter-spacing: -.025em;
      line-height: 1;
    }

    .period {
      display: inline-block;
      margin-left: 5px;
      color: #64748b;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: .02em;
      text-align: left;
    }

  </style>
</head>
<body>
  <main class="widget" aria-label="Live world clock">
    <section class="city" aria-label="London">
      <span class="city-name">London</span>
      <time class="clock" id="london" aria-label="London local time">--:--<span class="period">--</span></time>
    </section>
    <section class="city" aria-label="New York">
      <span class="city-name">New York</span>
      <time class="clock" id="new-york" aria-label="New York local time">--:--<span class="period">--</span></time>
    </section>
    <section class="city" aria-label="Rotterdam">
      <span class="city-name">Rotterdam</span>
      <time class="clock" id="rotterdam" aria-label="Rotterdam local time">--:--<span class="period">--</span></time>
    </section>
  </main>
  <script>
    const places = [
      { id: "london", zone: "Europe/London" },
      { id: "new-york", zone: "America/New_York" },
      { id: "rotterdam", zone: "Europe/Amsterdam" }
    ];

    const timeFormatters = places.map(({ id, zone }) => ({
      id,
      zone,
      formatter: new Intl.DateTimeFormat("en-GB", {
        timeZone: zone,
        minute: "2-digit",
        hour: "numeric",
        hour12: true
      })
    }));
    function updateClocks() {
      const now = new Date();
      for (const { id, zone, formatter } of timeFormatters) {
        const parts = Object.fromEntries(formatter.formatToParts(now).map(({ type, value }) => [type, value]));
        const clock = document.getElementById(id);
        clock.innerHTML = `${parts.hour}:${parts.minute}<span class="period">${parts.dayPeriod.toUpperCase()}</span>`;
        clock.dateTime = now.toISOString();
        clock.setAttribute("aria-label", `${zone.replaceAll("_", " ")} local time ${parts.hour}:${parts.minute} ${parts.dayPeriod.toUpperCase()}`);
      }
    }

    updateClocks();
    setInterval(updateClocks, 15000);
  </script>
</body>
</html>
